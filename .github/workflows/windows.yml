name: Windows

# Builds Betterbird for Windows/x86_64 from the patches in this repository on a
# GitHub-hosted runner and uploads the resulting installer as a workflow
# artifact. See "GitHub Actions builds" in README.md for details.
#
#   mode=build    full build; "mach build" runs under a time budget and the
#                 sccache directory is cached between runs, so a run that stops
#                 at its budget is continued by starting the workflow again.
#   mode=prepare  only clone the sources and apply the patch series (smoke test).

on:
  # Manual run
  workflow_dispatch:
    inputs:
      version:
        description: "ESR version to build"
        default: "140"
        required: true
        type: choice
        options: ["140", "153"]
      mode:
        description: "prepare = clone sources and apply patches only (smoke test)"
        default: build
        required: true
        type: choice
        options: [build, prepare]
      budget-minutes:
        description: "Minutes for mach build, then stop and cache (continue by running again)"
        default: "240"
        required: true
        type: choice
        options: ["180", "240", "300"]
      fresh:
        description: "Ignore the cached compiler output (use after a cache was corrupted)"
        default: false
        required: true
        type: boolean
  # Run on tag push, e.g. "140.0-automation"
  push:
    tags: '[0-9][0-9][0-9].*-automation'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  MODE: ${{ inputs.mode || 'build' }}
  BUDGET_MINUTES: ${{ inputs.budget-minutes || '240' }}
  # sccache on local disk; the GitHub Actions cache backend is not available on
  # hosted runners, so the directory is cached with actions/cache instead.
  SCCACHE_DIR: C:\sccache
  SCCACHE_CACHE_SIZE: 8G
  FRESH: ${{ inputs.fresh }}
  USE_MINTTY: "0"

jobs:
  build:
    name: Windows x86_64 (ESR ${{ inputs.version || github.ref_name }})
    runs-on: windows-2022
    timeout-minutes: 355 # GitHub-hosted runners allow at most 360 minutes.
    defaults:
      run:
        shell: pwsh
    # Optional code signing certificate. Betterbird's Windows branding patch
    # signs binaries and the installer with the code signing certificate from
    # the certificate store of the current user, so providing one makes the
    # build produce properly signed artifacts (see README.md).
    env:
      SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}

    steps:
    - name: Show disk space
      run: Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystemLabel, @{ n = 'FreeGB'; e = { [math]::Round($_.SizeRemaining / 1GB, 1) } }, @{ n = 'SizeGB'; e = { [math]::Round($_.Size / 1GB, 1) } }
    - name: Increase page file
      # The action throws "Exception calling SetPageFileSize ... The operation
      # completed successfully" and a larger page file only takes effect after a
      # reboot, which a hosted runner never does. The ESR 153 build ran out of
      # memory, so ask for more and let the next step report the truth.
      uses: al-cheb/configure-pagefile-action@v1.5
      continue-on-error: true
      with:
        minimum-size: 32GB
        maximum-size: 32GB
        disk-root: "C:"
    - name: Show page file
      run: Get-CimInstance Win32_PageFileUsage | Format-Table Name, AllocatedBaseSize, CurrentUsage
    - name: Keep LF line endings
      # The runner image sets core.autocrlf=true, which would check out the
      # patch series with CRLF line endings and break "hg qpush".
      run: git config --global core.autocrlf false
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # build.sh expects a directory called "thunderbird-patches" next to the
        # build directory it runs in, i.e. next to $GITHUB_WORKSPACE itself.
        path: thunderbird-patches
    - name: Install MozillaBuild
      run: |
        $ErrorActionPreference = "Stop"
        $setup = Join-Path $env:RUNNER_TEMP "MozillaBuildSetup-Latest.exe"
        Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe" -OutFile $setup
        Start-Process -FilePath $setup -ArgumentList "/S", "/D=C:\mozilla-build" -Wait
        if (-not (Test-Path "C:\mozilla-build\start-shell.bat")) {
          throw "MozillaBuild installation failed"
        }
    - name: Rebase MSYS2 DLLs
      # Without a rebase some MSYS2 forks fail with "child_info_fork::abort:
      # Loaded to different address", which kills the build with
      # "find: cannot fork: Resource temporarily unavailable".
      continue-on-error: true
      run: |
        & "C:\mozilla-build\msys2\usr\bin\dash.exe" -c "/usr/bin/rebase -s -b 0x4000000000 /usr/bin/*.dll"
        if ($LASTEXITCODE -ne 0) { Write-Warning "rebase exited with code $LASTEXITCODE" }
    - name: Resolve version
      run: |
        $ver = ("$env:VERSION" + "___").Substring(0, 3)
        "VER3=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Host "Building ESR $ver"
    - name: Import code signing certificate
      if: env.SIGNING_PFX_BASE64 != ''
      run: |
        $ErrorActionPreference = "Stop"
        $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
        $password = ConvertTo-SecureString -String $env:SIGNING_PFX_PASSWORD -Force -AsPlainText
        Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
        Remove-Item $pfx
        Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Format-Table Subject, Thumbprint
    - name: Restore compiler cache
      # A run that ends because a compiler was killed (out of memory) can leave
      # truncated objects in the cache; they surface later as
      # "No rule to make target ... Unified_cpp_...obj" when xul.dll links. With
      # fresh=checked skip the restore and fill a clean cache from scratch.
      if: inputs.fresh != true
      uses: actions/cache/restore@v4
      with:
        path: C:\sccache
        key: sccache-win-${{ env.VER3 }}-${{ github.run_id }}
        restore-keys: |
          sccache-win-${{ env.VER3 }}-
    - name: Build
      id: build
      run: |
        # The build runs in the MozillaBuild shell, which provides the MSYS2
        # environment (mercurial, sed, wget, ...) that the build scripts need.
        $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
        $msysWorkspace = '/' + $workspace.Substring(0, 1).ToLower() + $workspace.Substring(2)
        Write-Host "Workspace in MSYS notation: $msysWorkspace, mode: $env:MODE"
        Remove-Item "$env:GITHUB_WORKSPACE\ci-build-*" -ErrorAction SilentlyContinue
        if ($env:MODE -eq 'prepare') {
          & "C:\mozilla-build\start-shell.bat" "$msysWorkspace/thunderbird-patches/build/ci/windows-build.sh"
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\ci-build-succeeded")) {
            throw "Prepare failed, see the log above"
          }
          "complete=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        }
        else {
          & "C:\mozilla-build\start-shell.bat" "$msysWorkspace/thunderbird-patches/build/ci/windows-full.sh"
          if (Test-Path "$env:GITHUB_WORKSPACE\ci-build-complete") {
            "complete=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          elseif (Test-Path "$env:GITHUB_WORKSPACE\ci-build-budget") {
            "complete=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::notice::Time budget reached. Start the workflow again to continue with the cached compiler output."
          }
          else {
            throw "Build failed, see the log above"
          }
        }
    - name: Save compiler cache
      if: ${{ always() }}
      uses: actions/cache/save@v4
      with:
        path: C:\sccache
        key: sccache-win-${{ env.VER3 }}-${{ github.run_id }}
    - name: Upload installer
      if: steps.build.outputs.complete == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: betterbird-windows-x86_64-${{ env.VER3 }}
        # ESR 153 puts the installer in dist/, older versions in dist/install/sea/.
        path: |
          mozilla-esr*/obj-*/dist/*.installer.exe
          mozilla-esr*/obj-*/dist/install/sea/*.installer.exe
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
